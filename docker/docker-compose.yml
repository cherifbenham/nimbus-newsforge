version: "3.8"

services:
  # Backend Flask API
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: newsletter-backend
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - PROJECT_ID=${PROJECT_ID}
      - LOCATION=${LOCATION:-europe-west4}
      - REGION=${REGION:-europe-west4}
      - FIRESTORE_DATABASE_ID=${FIRESTORE_DATABASE_ID}
      - COMPOSE_WEEKLY_SIM_WEIGHT=${COMPOSE_WEEKLY_SIM_WEIGHT:-0.3}
      - MODEL_FLASH=${MODEL_FLASH:-gemini-2.5-flash}
      - MODEL_PRO=${MODEL_PRO:-gemini-2.5-flash}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:*}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/service-account.json
    volumes:
      # Mount credentials for local development
      - ../fsa-amadeus-471508-796b6912a28f.json:/app/credentials/service-account.json:ro
      # Mount source code for hot-reload during development (optional)
      - ../server:/app
    restart: unless-stopped
    networks:
      - newsletter-network

  # Frontend React/Vite
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:5001/api
    container_name: newsletter-frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - newsletter-network

networks:
  newsletter-network:
    driver: bridge
